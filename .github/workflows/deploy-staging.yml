name: Deploy CDK (staging)

# Policy: **`main` → staging** (manual); see `.forge/operations/deployment_environments.md`.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to deploy (must be main)'
        required: true
        default: 'main'
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cdk-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      META_FACEBOOK_APP_ID: ${{ vars.META_FACEBOOK_APP_ID }}
      STAGING_FAN_WEB_HOSTNAME: ${{ vars.STAGING_FAN_WEB_HOSTNAME }}
      STAGING_FAN_WEB_CERTIFICATE_ARN: ${{ vars.STAGING_FAN_WEB_CERTIFICATE_ARN }}
      STAGING_FAN_WEB_ALTERNATE_DOMAIN_NAMES: ${{ vars.STAGING_FAN_WEB_ALTERNATE_DOMAIN_NAMES }}
      STAGING_FAN_WEB_CANONICAL_HOSTNAME: ${{ vars.STAGING_FAN_WEB_CANONICAL_HOSTNAME }}
      RIFFSYNC_ROUTE53_HOSTED_ZONE_ID: ${{ vars.RIFFSYNC_ROUTE53_HOSTED_ZONE_ID }}
      RIFFSYNC_ROUTE53_ZONE_NAME: ${{ vars.RIFFSYNC_ROUTE53_ZONE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Require main-aligned ref
        if: ${{ github.event.inputs.git_ref != 'main' }}
        run: |
          echo "::error::Staging deploy policy is main only (requested: ${{ github.event.inputs.git_ref }}). See infra/cdk/README.md and .forge/operations/deployment_environments.md"
          exit 1

      - name: Require staging OIDC configuration
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Set repository Variable AWS_DEPLOY_ROLE_ARN_STAGING to the IAM role ARN trusted via GitHub OIDC (see infra/cdk/README.md)."
            exit 1
          fi

      - name: Require Meta Facebook App ID (Cognito IdP)
        run: |
          if [ -z "${META_FACEBOOK_APP_ID:-}" ]; then
            echo "::error::Set repository Variable META_FACEBOOK_APP_ID to your Meta App ID (see infra/cdk/README.md — passed as CDK --context facebookAppId)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - run: npm ci
        working-directory: infra/cdk
      - run: npm run build
        working-directory: infra/cdk

      - name: Deploy staging stack(s)
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          ARGS=(--context environment=staging)
          if [ -n "${STAGING_FAN_WEB_HOSTNAME:-}" ] && [ -n "${STAGING_FAN_WEB_CERTIFICATE_ARN:-}" ]; then
            ARGS+=(--context "fanWebCustomDomain=${STAGING_FAN_WEB_HOSTNAME}")
            ARGS+=(--context "fanWebCertificateArn=${STAGING_FAN_WEB_CERTIFICATE_ARN}")
          fi
          if [ -n "${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID:-}" ] && [ -n "${RIFFSYNC_ROUTE53_ZONE_NAME:-}" ]; then
            ARGS+=(--context "fanWebHostedZoneId=${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID}")
            ARGS+=(--context "fanWebZoneName=${RIFFSYNC_ROUTE53_ZONE_NAME}")
          fi
          if [ -n "${STAGING_FAN_WEB_ALTERNATE_DOMAIN_NAMES:-}" ]; then
            ARGS+=(--context "fanWebAlternateDomainNames=${STAGING_FAN_WEB_ALTERNATE_DOMAIN_NAMES}")
          fi
          if [ -n "${STAGING_FAN_WEB_CANONICAL_HOSTNAME:-}" ]; then
            ARGS+=(--context "fanWebCanonicalHostname=${STAGING_FAN_WEB_CANONICAL_HOSTNAME}")
          fi
          ARGS+=(--context "facebookAppId=${META_FACEBOOK_APP_ID}")
          if [ -z "${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID:-}" ] || [ -z "${RIFFSYNC_ROUTE53_ZONE_NAME:-}" ]; then
            echo "::notice::RiffSync: RIFFSYNC_ROUTE53_HOSTED_ZONE_ID / RIFFSYNC_ROUTE53_ZONE_NAME unset — static stack will not create Route 53 aliases (FanWebRoute53AliasRecordCount will be 0)."
          fi
          npx cdk deploy --all "${ARGS[@]}" --require-approval never

      - name: Point API CORS + Cognito OAuth at public staging site URL
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          ARGS=(--context environment=staging)
          if [ -n "${STAGING_FAN_WEB_HOSTNAME:-}" ] && [ -n "${STAGING_FAN_WEB_CERTIFICATE_ARN:-}" ]; then
            ARGS+=(--context "fanWebCustomDomain=${STAGING_FAN_WEB_HOSTNAME}")
            ARGS+=(--context "fanWebCertificateArn=${STAGING_FAN_WEB_CERTIFICATE_ARN}")
          fi
          if [ -n "${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID:-}" ] && [ -n "${RIFFSYNC_ROUTE53_ZONE_NAME:-}" ]; then
            ARGS+=(--context "fanWebHostedZoneId=${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID}")
            ARGS+=(--context "fanWebZoneName=${RIFFSYNC_ROUTE53_ZONE_NAME}")
          fi
          if [ -n "${STAGING_FAN_WEB_ALTERNATE_DOMAIN_NAMES:-}" ]; then
            ARGS+=(--context "fanWebAlternateDomainNames=${STAGING_FAN_WEB_ALTERNATE_DOMAIN_NAMES}")
          fi
          if [ -n "${STAGING_FAN_WEB_CANONICAL_HOSTNAME:-}" ]; then
            ARGS+=(--context "fanWebCanonicalHostname=${STAGING_FAN_WEB_CANONICAL_HOSTNAME}")
          fi
          ARGS+=(--context "facebookAppId=${META_FACEBOOK_APP_ID}")
          SITE_URL="$(aws cloudformation describe-stacks --stack-name RiffSyncStatic-staging \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          echo "Adding ${SITE_URL} to HTTP API CORS and Cognito SPA callbacks"
          npx cdk deploy RiffSyncFanAuth-staging RiffSyncApi-staging \
            "${ARGS[@]}" \
            --context "fanAuthOAuthExtras=${SITE_URL}/,${SITE_URL}/callback" \
            --context "catalogCorsOrigins=${SITE_URL}" \
            --require-approval never

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and publish fan SPA (staging)
        env:
          STACK_NAME: RiffSyncStatic-staging
          API_STACK_NAME: RiffSyncApi-staging
          FAN_AUTH_STACK_NAME: RiffSyncFanAuth-staging
        run: |
          set -euo pipefail
          SITE_URL="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          API_BASE="$(aws cloudformation describe-stacks --stack-name "$API_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)"
          WS_URL="$(aws cloudformation describe-stacks --stack-name "$API_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WebSocketUrl'].OutputValue" --output text)"
          COGNITO_BASE="$(aws cloudformation describe-stacks --stack-name "$FAN_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanHostedUiBaseUrl'].OutputValue" --output text)"
          COGNITO_DOMAIN="${COGNITO_BASE#https://}"
          COGNITO_CLIENT="$(aws cloudformation describe-stacks --stack-name "$FAN_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanUserPoolClientId'].OutputValue" --output text)"
          echo "Staging public site URL: ${SITE_URL}"
          echo "Staging HTTP API base: ${API_BASE}"
          cd "${GITHUB_WORKSPACE}/apps/web"
          npm ci
          VITE_PUBLIC_ORIGIN="${SITE_URL}" \
            VITE_PUBLIC_API_BASE_URL="${API_BASE}" \
            VITE_PUBLIC_WS_URL="${WS_URL}" \
            VITE_COGNITO_HOSTED_UI_DOMAIN="${COGNITO_DOMAIN}" \
            VITE_COGNITO_CLIENT_ID="${COGNITO_CLIENT}" \
            npm run build
          BUCKET="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          DIST="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          aws s3 sync ./dist/ "s3://${BUCKET}/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
