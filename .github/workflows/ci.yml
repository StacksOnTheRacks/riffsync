name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/cdk/**'
      - 'apps/web/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-prod.yml'
  push:
    branches: [main]
    paths:
      - 'infra/cdk/**'
      - 'apps/web/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/deploy-prod.yml'

permissions:
  contents: read

jobs:
  infra-cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: npm ci
      - run: npm run build
      - run: npx cdk synth --all --context environment=staging
      - run: npx cdk synth --all --context environment=prod
      - name: cfn-lint synthesized templates
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(cdk.out/**/*.template.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No *.template.json under cdk.out — synth may have failed silently"
            exit 1
          fi
          cfn-lint "${files[@]}"

  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
