name: Deploy CDK (production)

# Policy: **semver tags only** (`vMajor.Minor.Patch`); never arbitrary branches. See `.forge/operations/deployment_environments.md`.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing semver tag on this repo (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cdk-deploy-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROD_FAN_WEB_HOSTNAME: ${{ vars.PROD_FAN_WEB_HOSTNAME }}
      PROD_FAN_WEB_CERTIFICATE_ARN: ${{ vars.PROD_FAN_WEB_CERTIFICATE_ARN }}
      PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES: ${{ vars.PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES }}
      RIFFSYNC_ROUTE53_HOSTED_ZONE_ID: ${{ vars.RIFFSYNC_ROUTE53_HOSTED_ZONE_ID }}
      RIFFSYNC_ROUTE53_ZONE_NAME: ${{ vars.RIFFSYNC_ROUTE53_ZONE_NAME }}
    steps:
      - name: Validate semver tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match ^vMajor.Minor.Patch$ (received: ${tag})"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Resolve tag to annotated/lightweight HEAD
        run: git describe --tags --exact-match

      - name: Require prod OIDC configuration
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Set repository Variable AWS_DEPLOY_ROLE_ARN_PROD to the IAM role ARN trusted via GitHub OIDC (see infra/cdk/README.md)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - run: npm ci
        working-directory: infra/cdk
      - run: npm run build
        working-directory: infra/cdk

      - name: Deploy prod stack(s)
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          ARGS=(--context environment=prod)
          if [ -n "${PROD_FAN_WEB_HOSTNAME:-}" ] && [ -n "${PROD_FAN_WEB_CERTIFICATE_ARN:-}" ]; then
            ARGS+=(--context "fanWebCustomDomain=${PROD_FAN_WEB_HOSTNAME}")
            ARGS+=(--context "fanWebCertificateArn=${PROD_FAN_WEB_CERTIFICATE_ARN}")
          fi
          if [ -n "${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID:-}" ] && [ -n "${RIFFSYNC_ROUTE53_ZONE_NAME:-}" ]; then
            ARGS+=(--context "fanWebHostedZoneId=${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID}")
            ARGS+=(--context "fanWebZoneName=${RIFFSYNC_ROUTE53_ZONE_NAME}")
          fi
          if [ -n "${PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES:-}" ]; then
            ARGS+=(--context "fanWebAlternateDomainNames=${PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES}")
          fi
          npx cdk deploy --all "${ARGS[@]}" --require-approval never

      - name: Point API CORS + Cognito OAuth at public production site URL
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          ARGS=(--context environment=prod)
          if [ -n "${PROD_FAN_WEB_HOSTNAME:-}" ] && [ -n "${PROD_FAN_WEB_CERTIFICATE_ARN:-}" ]; then
            ARGS+=(--context "fanWebCustomDomain=${PROD_FAN_WEB_HOSTNAME}")
            ARGS+=(--context "fanWebCertificateArn=${PROD_FAN_WEB_CERTIFICATE_ARN}")
          fi
          if [ -n "${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID:-}" ] && [ -n "${RIFFSYNC_ROUTE53_ZONE_NAME:-}" ]; then
            ARGS+=(--context "fanWebHostedZoneId=${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID}")
            ARGS+=(--context "fanWebZoneName=${RIFFSYNC_ROUTE53_ZONE_NAME}")
          fi
          if [ -n "${PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES:-}" ]; then
            ARGS+=(--context "fanWebAlternateDomainNames=${PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES}")
          fi
          SITE_URL="$(aws cloudformation describe-stacks --stack-name RiffSyncStatic-prod \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          echo "Adding ${SITE_URL} to HTTP API CORS and Cognito SPA callbacks"
          npx cdk deploy RiffSyncFanAuth-prod RiffSyncApi-prod \
            "${ARGS[@]}" \
            --context "fanAuthOAuthExtras=${SITE_URL}/,${SITE_URL}/callback" \
            --context "catalogCorsOrigins=${SITE_URL}" \
            --require-approval never

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and publish fan SPA (production)
        env:
          STACK_NAME: RiffSyncStatic-prod
          API_STACK_NAME: RiffSyncApi-prod
        run: |
          set -euo pipefail
          SITE_URL="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          API_BASE="$(aws cloudformation describe-stacks --stack-name "$API_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)"
          echo "Production public site URL: ${SITE_URL}"
          echo "Production HTTP API base: ${API_BASE}"
          cd "${GITHUB_WORKSPACE}/apps/web"
          npm ci
          VITE_PUBLIC_ORIGIN="${SITE_URL}" \
            VITE_PUBLIC_API_BASE_URL="${API_BASE}" \
            npm run build
          BUCKET="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          DIST="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          aws s3 sync ./dist/ "s3://${BUCKET}/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
