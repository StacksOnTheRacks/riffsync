name: Deploy CDK (production)

# Policy: **semver tags only** (`vMajor.Minor.Patch`); never arbitrary branches. See `.forge/operations/deployment_environments.md`.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing semver tag on this repo (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cdk-deploy-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - name: Validate semver tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match ^vMajor.Minor.Patch$ (received: ${tag})"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Resolve tag to annotated/lightweight HEAD
        run: git describe --tags --exact-match

      - name: Require prod OIDC configuration
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Set repository Variable AWS_DEPLOY_ROLE_ARN_PROD to the IAM role ARN trusted via GitHub OIDC (see infra/cdk/README.md)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Deploy prod stack(s)
        run: >-
          npx cdk deploy --all
          --context environment=prod
          --require-approval never
