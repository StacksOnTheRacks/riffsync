name: Deploy CDK (production)

# Policy: **`main` → production** (manual). See `.forge/operations/deployment_environments.md`.
#
# CDK jobs follow the **dependency graph**, with **parallelism** where stacks are independent:
# - **TURN** and **platform** (fan auth, static, SES) run together.
# - **API** (exclusive) and **SFU** run together once their prerequisites exist (**API** also waits for platform).
# Api must not import SFU exports (see **`bin/riffsync.ts`**) or SFU updates can fail when run in parallel with Api.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to deploy (must be main)'
        required: true
        default: 'main'
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cdk-deploy-production
  cancel-in-progress: false

env:
  PROD_FAN_WEB_HOSTNAME: ${{ vars.PROD_FAN_WEB_HOSTNAME }}
  PROD_FAN_WEB_CERTIFICATE_ARN: ${{ vars.PROD_FAN_WEB_CERTIFICATE_ARN }}
  PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES: ${{ vars.PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES }}
  PROD_FAN_WEB_CANONICAL_HOSTNAME: ${{ vars.PROD_FAN_WEB_CANONICAL_HOSTNAME }}
  RIFFSYNC_ROUTE53_HOSTED_ZONE_ID: ${{ vars.RIFFSYNC_ROUTE53_HOSTED_ZONE_ID }}
  RIFFSYNC_ROUTE53_ZONE_NAME: ${{ vars.RIFFSYNC_ROUTE53_ZONE_NAME }}
  PROD_TURN_HOST: ${{ vars.PROD_TURN_HOST }}
  PROD_TURN_PORT: ${{ vars.PROD_TURN_PORT }}
  PROD_TURN_TLS_PORT: ${{ vars.PROD_TURN_TLS_PORT }}
  PROD_TURN_CREDENTIAL_TTL_SECONDS: ${{ vars.PROD_TURN_CREDENTIAL_TTL_SECONDS }}
  PROD_SFU_PUBLIC_WS_URL: ${{ vars.PROD_SFU_PUBLIC_WS_URL }}
  PROD_SFU_SIGNALING_HOSTNAME: ${{ vars.PROD_SFU_SIGNALING_HOSTNAME }}

jobs:
  cdk-turn:
    name: CDK prod – TURN (VPC + coturn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Route 53 notice (static / SFU DNS aliases)
        run: |
          if [ -z "${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID:-}" ] || [ -z "${RIFFSYNC_ROUTE53_ZONE_NAME:-}" ]; then
            echo "::notice::RiffSync: RIFFSYNC_ROUTE53_HOSTED_ZONE_ID / RIFFSYNC_ROUTE53_ZONE_NAME unset — static stack will not create Route 53 aliases (FanWebRoute53AliasRecordCount will be 0)."
          fi

      - name: Deploy RiffSyncTurn
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          npx cdk deploy RiffSyncTurn "${CDK_CTX[@]}" --require-approval never

  cdk-platform:
    name: CDK prod – Fan auth, static site, SES inbound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy RiffSyncFanAuth-prod, RiffSyncStatic-prod, RiffSyncSesInbound
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          npx cdk deploy RiffSyncFanAuth-prod RiffSyncStatic-prod RiffSyncSesInbound "${CDK_CTX[@]}" --require-approval never

  cdk-api:
    name: CDK prod – API (exclusive; deps already deployed)
    needs:
      - cdk-turn
      - cdk-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy RiffSyncApi-prod
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          npx cdk deploy RiffSyncApi-prod --exclusively "${CDK_CTX[@]}" --require-approval never

  cdk-sfu:
    name: CDK prod – SFU (mediasoup; parallel with API after Turn)
    needs:
      - cdk-turn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy RiffSyncSfu
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          npx cdk deploy RiffSyncSfu "${CDK_CTX[@]}" --require-approval never

  cdk-oauth-cors:
    name: CDK prod – Cognito OAuth + API CORS from CloudFront URL
    needs:
      - cdk-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Point API CORS + Cognito OAuth at public production site URL
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          SITE_URL="$(aws cloudformation describe-stacks --stack-name RiffSyncStatic-prod \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          echo "Adding ${SITE_URL} to HTTP API CORS and Cognito SPA callbacks"
          npx cdk deploy RiffSyncFanAuth-prod RiffSyncApi-prod \
            "${CDK_CTX[@]}" \
            --context "fanAuthOAuthExtras=${SITE_URL}/,${SITE_URL}/auth/callback" \
            --context "catalogCorsOrigins=${SITE_URL}" \
            --require-approval never

  fan-spa:
    name: Build and publish fan SPA (production)
    needs:
      - cdk-oauth-cors
      - cdk-sfu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Require main-aligned ref
        if: ${{ github.event.inputs.git_ref != 'main' }}
        run: |
          echo "::error::Production deploy policy is main only (requested: ${{ github.event.inputs.git_ref }})."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and publish fan SPA (production)
        env:
          STACK_NAME: RiffSyncStatic-prod
          API_STACK_NAME: RiffSyncApi-prod
          FAN_AUTH_STACK_NAME: RiffSyncFanAuth-prod
        run: |
          set -euo pipefail
          SITE_URL="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          API_BASE="$(aws cloudformation describe-stacks --stack-name "$API_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)"
          WS_URL="$(aws cloudformation describe-stacks --stack-name "$API_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WebSocketUrl'].OutputValue" --output text)"
          COGNITO_BASE="$(aws cloudformation describe-stacks --stack-name "$FAN_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanHostedUiBaseUrl'].OutputValue" --output text)"
          COGNITO_DOMAIN="${COGNITO_BASE#https://}"
          COGNITO_CLIENT="$(aws cloudformation describe-stacks --stack-name "$FAN_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanUserPoolClientId'].OutputValue" --output text)"
          echo "Production public site URL: ${SITE_URL}"
          echo "Production HTTP API base: ${API_BASE}"
          cd "${GITHUB_WORKSPACE}/apps/web"
          npm ci
          export VITE_WEBRTC_USE_MEDIASOU_SFU=true
          if [ -n "${PROD_SFU_PUBLIC_WS_URL:-}" ]; then
            export VITE_PUBLIC_SFU_WS_URL="${PROD_SFU_PUBLIC_WS_URL}"
          fi
          VITE_PUBLIC_ORIGIN="${SITE_URL}" \
            VITE_PUBLIC_API_BASE_URL="${API_BASE}" \
            VITE_PUBLIC_WS_URL="${WS_URL}" \
            VITE_COGNITO_HOSTED_UI_DOMAIN="${COGNITO_DOMAIN}" \
            VITE_COGNITO_CLIENT_ID="${COGNITO_CLIENT}" \
            npm run build
          BUCKET="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          DIST="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          aws s3 sync ./dist/ "s3://${BUCKET}/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
