name: Deploy CDK (production)

# Policy: **`main` → production** (manual). See `.ai/operations/deployment_environments.md`.
#
# - **Media** (**`RiffSyncTurn`**: TURN + SFU + VPC) and **platform** (fan + staff auth, static, SES) run in parallel.
# - **API** (`--exclusively`) runs after both (**`RiffSyncApi-prod`** imports turn secret from **`RiffSyncTurn`**).
# OAuth/CORS uses **`--exclusively`** so CDK does not redeploy **`RiffSyncTurn`** while updating Cognito + API.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to deploy (must be main)'
        required: true
        default: 'main'
        type: string
      allow_media_replacement:
        description: 'Allow RiffSyncTurn EC2 replacement during a planned media maintenance window'
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: cdk-deploy-production
  cancel-in-progress: false

env:
  PROD_FAN_WEB_HOSTNAME: ${{ vars.PROD_FAN_WEB_HOSTNAME }}
  PROD_FAN_WEB_CERTIFICATE_ARN: ${{ vars.PROD_FAN_WEB_CERTIFICATE_ARN }}
  PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES: ${{ vars.PROD_FAN_WEB_ALTERNATE_DOMAIN_NAMES }}
  PROD_FAN_WEB_CANONICAL_HOSTNAME: ${{ vars.PROD_FAN_WEB_CANONICAL_HOSTNAME }}
  RIFFSYNC_ROUTE53_HOSTED_ZONE_ID: ${{ vars.RIFFSYNC_ROUTE53_HOSTED_ZONE_ID }}
  RIFFSYNC_ROUTE53_ZONE_NAME: ${{ vars.RIFFSYNC_ROUTE53_ZONE_NAME }}
  PROD_TURN_HOST: ${{ vars.PROD_TURN_HOST }}
  PROD_TURN_PORT: ${{ vars.PROD_TURN_PORT }}
  PROD_TURN_TLS_PORT: ${{ vars.PROD_TURN_TLS_PORT }}
  PROD_TURN_CREDENTIAL_TTL_SECONDS: ${{ vars.PROD_TURN_CREDENTIAL_TTL_SECONDS }}
  PROD_SFU_PUBLIC_WS_URL: ${{ vars.PROD_SFU_PUBLIC_WS_URL }}
  PROD_SFU_SIGNALING_HOSTNAME: ${{ vars.PROD_SFU_SIGNALING_HOSTNAME }}

jobs:
  cdk-media:
    name: CDK prod – Media (TURN + SFU, RiffSyncTurn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Route 53 notice (static / SFU DNS aliases)
        run: |
          if [ -z "${RIFFSYNC_ROUTE53_HOSTED_ZONE_ID:-}" ] || [ -z "${RIFFSYNC_ROUTE53_ZONE_NAME:-}" ]; then
            echo "::notice::RiffSync: RIFFSYNC_ROUTE53_HOSTED_ZONE_ID / RIFFSYNC_ROUTE53_ZONE_NAME unset — static stack will not create Route 53 aliases (FanWebRoute53AliasRecordCount will be 0)."
          fi

      - name: Release stale media instance imports from observability
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          mapfile -t MEDIA_INSTANCE_EXPORTS < <(
            aws cloudformation list-exports \
              --query "Exports[?starts_with(Name, 'RiffSyncTurn:ExportsOutputRefMediasoupSfuHost') || starts_with(Name, 'RiffSyncTurn:ExportsOutputRefTurnInstance')].Name" \
              --output text | tr '\t' '\n' | sed '/^$/d'
          )

          needs_observability_release=0
          for export_name in "${MEDIA_INSTANCE_EXPORTS[@]}"; do
            if aws cloudformation list-imports --export-name "$export_name" \
              --query 'Imports[]' --output text | tr '\t' '\n' | grep -qx 'RiffSyncObservability-prod'; then
              needs_observability_release=1
            fi
          done

          if [ "$needs_observability_release" -eq 1 ]; then
            echo "RiffSyncObservability-prod still imports media EC2 instance IDs; deploying dashboard stack first to release them."
            npx cdk deploy RiffSyncObservability-prod --exclusively "${CDK_CTX[@]}" --require-approval never
          else
            echo "No stale RiffSyncObservability-prod media instance imports found."
          fi

      - name: Deploy RiffSyncTurn (coturn + mediasoup SFU)
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          MEDIA_AMI_CTX=()

          turn_instance_id="$(aws cloudformation describe-stack-resource \
            --stack-name RiffSyncTurn \
            --logical-resource-id TurnInstanceAE0C2A65 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text 2>/dev/null || true)"
          if [ -n "$turn_instance_id" ] && [ "$turn_instance_id" != "None" ]; then
            turn_ami_id="$(aws ec2 describe-instances \
              --instance-ids "$turn_instance_id" \
              --query 'Reservations[0].Instances[0].ImageId' \
              --output text)"
            MEDIA_AMI_CTX+=(--context "turnAmiId=${turn_ami_id}")
          fi

          sfu_instance_id="$(aws cloudformation describe-stack-resource \
            --stack-name RiffSyncTurn \
            --logical-resource-id MediasoupSfuHost3A378EC0 \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text 2>/dev/null || true)"
          if [ -n "$sfu_instance_id" ] && [ "$sfu_instance_id" != "None" ]; then
            sfu_ami_id="$(aws ec2 describe-instances \
              --instance-ids "$sfu_instance_id" \
              --query 'Reservations[0].Instances[0].ImageId' \
              --output text)"
            MEDIA_AMI_CTX+=(--context "sfuAmiId=${sfu_ami_id}")
          fi

          npx cdk diff RiffSyncTurn "${CDK_CTX[@]}" "${MEDIA_AMI_CTX[@]}" > /tmp/riffsync-turn.diff || true
          if grep -Eq 'requires replacement|may cause replacement|may be replaced|\(replaced\)| destroy$| replace$' /tmp/riffsync-turn.diff; then
            cat /tmp/riffsync-turn.diff
            if [ "${{ github.event.inputs.allow_media_replacement }}" != "true" ]; then
              echo "::error::RiffSyncTurn deploy would replace infrastructure. Re-run with allow_media_replacement=true during a planned maintenance window."
              exit 1
            fi
          fi

          npx cdk deploy RiffSyncTurn "${CDK_CTX[@]}" "${MEDIA_AMI_CTX[@]}" --require-approval never

  cdk-platform:
    name: CDK prod – Fan + staff auth, static site, SES inbound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy RiffSyncFanAuth-prod, RiffSyncStaffAuth-prod, RiffSyncStatic-prod, RiffSyncSesInbound
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          npx cdk deploy RiffSyncFanAuth-prod RiffSyncStaffAuth-prod RiffSyncStatic-prod RiffSyncSesInbound "${CDK_CTX[@]}" --require-approval never

  cdk-api:
    name: CDK prod – API (exclusive; deps already deployed)
    needs:
      - cdk-media
      - cdk-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy RiffSyncApi-prod
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          npx cdk deploy RiffSyncApi-prod --exclusively "${CDK_CTX[@]}" --require-approval never

  cdk-observability:
    name: CDK prod – CloudWatch operations dashboard
    needs:
      - cdk-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy RiffSyncObservability-prod
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          npx cdk deploy RiffSyncObservability-prod --exclusively "${CDK_CTX[@]}" --require-approval never

  cdk-oauth-cors:
    name: CDK prod – Cognito OAuth + API CORS from CloudFront URL
    needs:
      - cdk-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - uses: ./.github/actions/riffsync-cdk-prod-setup
        with:
          git_ref: ${{ github.event.inputs.git_ref }}
          aws_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Point API CORS + Cognito OAuth at public production site URL
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          mapfile -t CDK_CTX < <(bash scripts/cdk-prod-context-args.sh)
          SITE_URL="$(aws cloudformation describe-stacks --stack-name RiffSyncStatic-prod \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          echo "Adding ${SITE_URL} to HTTP API CORS and Cognito SPA callbacks"
          # --exclusively: Api depends on RiffSyncTurn; without this CDK would redeploy media (TURN+SFU).
          npx cdk deploy RiffSyncFanAuth-prod RiffSyncStaffAuth-prod RiffSyncApi-prod --exclusively \
            "${CDK_CTX[@]}" \
            --context "fanAuthOAuthExtras=${SITE_URL}/,${SITE_URL}/auth/callback" \
            --context "staffAuthOAuthExtras=${SITE_URL}/admin/auth/callback,${SITE_URL}/admin/login" \
            --context "catalogCorsOrigins=${SITE_URL}" \
            --require-approval never

  fan-spa:
    name: Build and publish fan SPA (production)
    needs:
      - cdk-oauth-cors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Require main-aligned ref
        if: ${{ github.event.inputs.git_ref != 'main' }}
        run: |
          echo "::error::Production deploy policy is main only (requested: ${{ github.event.inputs.git_ref }})."
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and publish fan SPA (production)
        env:
          STACK_NAME: RiffSyncStatic-prod
          API_STACK_NAME: RiffSyncApi-prod
          FAN_AUTH_STACK_NAME: RiffSyncFanAuth-prod
          STAFF_AUTH_STACK_NAME: RiffSyncStaffAuth-prod
          PROD_CAST_RECEIVER_APP_ID: 77E78672
        run: |
          set -euo pipefail
          SITE_URL="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanWebSiteUrl'].OutputValue" --output text)"
          API_BASE="$(aws cloudformation describe-stacks --stack-name "$API_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)"
          WS_URL="$(aws cloudformation describe-stacks --stack-name "$API_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WebSocketUrl'].OutputValue" --output text)"
          COGNITO_BASE="$(aws cloudformation describe-stacks --stack-name "$FAN_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanHostedUiBaseUrl'].OutputValue" --output text)"
          COGNITO_DOMAIN="${COGNITO_BASE#https://}"
          COGNITO_CLIENT="$(aws cloudformation describe-stacks --stack-name "$FAN_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FanUserPoolClientId'].OutputValue" --output text)"
          STAFF_COGNITO_BASE="$(aws cloudformation describe-stacks --stack-name "$STAFF_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='StaffHostedUiBaseUrl'].OutputValue" --output text)"
          STAFF_COGNITO_DOMAIN="${STAFF_COGNITO_BASE#https://}"
          STAFF_COGNITO_CLIENT="$(aws cloudformation describe-stacks --stack-name "$STAFF_AUTH_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='StaffUserPoolClientId'].OutputValue" --output text)"
          echo "Production public site URL: ${SITE_URL}"
          echo "Production HTTP API base: ${API_BASE}"
          cd "${GITHUB_WORKSPACE}/apps/web"
          npm ci
          if [ -n "${PROD_SFU_PUBLIC_WS_URL:-}" ]; then
            export VITE_PUBLIC_SFU_WS_URL="${PROD_SFU_PUBLIC_WS_URL}"
          fi
          VITE_PUBLIC_ORIGIN="${SITE_URL}" \
            VITE_PUBLIC_API_BASE_URL="${API_BASE}" \
            VITE_PUBLIC_WS_URL="${WS_URL}" \
            VITE_CAST_RECEIVER_APP_ID="${PROD_CAST_RECEIVER_APP_ID}" \
            VITE_GA_MEASUREMENT_ID="${PROD_GA_MEASUREMENT_ID:-G-VQ0ME789CS}" \
            VITE_COGNITO_HOSTED_UI_DOMAIN="${COGNITO_DOMAIN}" \
            VITE_COGNITO_CLIENT_ID="${COGNITO_CLIENT}" \
            VITE_STAFF_COGNITO_HOSTED_UI_DOMAIN="${STAFF_COGNITO_DOMAIN}" \
            VITE_STAFF_COGNITO_CLIENT_ID="${STAFF_COGNITO_CLIENT}" \
            npm run build
          BUCKET="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)"
          DIST="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          aws s3 sync ./dist/ "s3://${BUCKET}/" --delete
          aws s3 cp ./dist/robots.txt "s3://${BUCKET}/robots.txt" \
            --cache-control "public, max-age=3600" \
            --content-type "text/plain"
          aws s3 cp ./dist/sitemap.xml "s3://${BUCKET}/sitemap.xml" \
            --cache-control "public, max-age=3600" \
            --content-type "application/xml"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
