name: infra-cdk

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/cdk/**'
      - '.github/workflows/infra-cdk.yml'
  push:
    branches: [main]
    paths:
      - 'infra/cdk/**'
      - '.github/workflows/infra-cdk.yml'

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cdk synth --all --context environment=staging
      - run: npx cdk synth --all --context environment=prod
